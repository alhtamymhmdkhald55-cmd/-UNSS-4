
name: Build Anis UNSS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project
        run: unzip -q anis-unss-notifications-adhan-organized.zip -d proj

      - name: Install dependencies
        working-directory: proj
        run: npm install

      - name: Add Android platform
        working-directory: proj
        run: npx cap add android

      - name: Enable exact alarms
        working-directory: proj
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' android/app/src/main/AndroidManifest.xml

      - name: Copy icons and sounds
        working-directory: proj
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp resources/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/
          done
          mkdir -p android/app/src/main/res/raw
          cp resources/sounds/*.wav android/app/src/main/res/raw/
          cp resources/sounds/adhan.mp3 android/app/src/main/res/raw/

      - name: Sync Android
        working-directory: proj
        run: npx cap sync android

      - name: Build APK
        working-directory: proj/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anis-unss-apk
          path: proj/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
